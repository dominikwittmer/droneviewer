syntax = "proto3";

package Meshtastic;

option csharp_namespace = "Meshtastic.Protobufs";

// FromRadio - Daten vom Meshtastic-Gerät
message FromRadio {
  oneof payload_variant {
    MeshPacket packet = 2;
    MyNodeInfo my_info = 3;
    NodeInfo node_info = 4;
  }
}

// MeshPacket - Ein Mesh-Netzwerk-Paket
message MeshPacket {
  uint32 from = 1;
  uint32 to = 2;
  Data decoded = 3;
  uint32 id = 6;
}

// Data - Nutzdaten eines Pakets
message Data {
  PortNum portnum = 1;
  bytes payload = 2;
}

// PortNum - Anwendungstypen
enum PortNum {
  UNKNOWN_APP = 0;
  TEXT_MESSAGE_APP = 1;
  POSITION_APP = 3;
  WAYPOINT_APP = 6;
  TELEMETRY_APP = 67;
}

// MyNodeInfo - Info über den eigenen Empfänger
message MyNodeInfo {
  uint32 my_node_num = 1;
}

// NodeInfo - Info über andere Nodes
message NodeInfo {
  uint32 num = 1;
  User user = 2;
}

// User - Benutzer-Informationen
message User {
  string id = 1;
  string long_name = 2;
  string short_name = 3;
}

// Position - GPS-Position
message Position {
  int32 latitude_i = 1;
  int32 longitude_i = 2;
  int32 altitude = 3;
  fixed32 time = 4;
}

// Waypoint - Wegpunkt
message Waypoint {
  uint32 id = 1;
  int32 latitude_i = 2;
  int32 longitude_i = 3;
  fixed32 expire = 4;
  uint32 locked_to = 5;
  string name = 6;
  string description = 7;
  uint32 icon = 8;
}

// Telemetry - Telemetriedaten
message Telemetry {
  fixed32 time = 1;
  oneof variant {
    DeviceMetrics device_metrics = 2;
    EnvironmentMetrics environment_metrics = 3;
  }
}

// DeviceMetrics - Geräte-Metriken
message DeviceMetrics {
  uint32 battery_level = 1;
  float voltage = 2;
  float channel_utilization = 3;
  float air_util_tx = 4;
}

// EnvironmentMetrics - Umgebungs-Metriken
message EnvironmentMetrics {
  float temperature = 1;
  float relative_humidity = 2;
  float barometric_pressure = 3;
}
